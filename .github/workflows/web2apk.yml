name: Build Web2APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project"
        required: true
        type: string
      tag:
        description: "Tag build"
        required: true
        type: string
      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options: [debug, release]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Download ZIP
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          rm -f project.zip

          for token in "$GH_TOKEN" ""; do
            if [ -n "$token" ]; then
              curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 15 \
                -H "Authorization: Bearer $token" \
                -H "Accept: application/octet-stream" \
                "${{ github.event.inputs.zip_url }}" -o project.zip 2>/dev/null || rm -f project.zip
            else
              curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 15 \
                "${{ github.event.inputs.zip_url }}" -o project.zip 2>/dev/null || rm -f project.zip
            fi
            [ -s project.zip ] && unzip -tq project.zip >/dev/null 2>&1 && break
            rm -f project.zip
          done

          [ -s project.zip ] && unzip -tq project.zip >/dev/null 2>&1 || {
            echo "::error::ZIP tidak valid atau tidak dapat diunduh"
            exit 1
          }
          echo "ZIP OK: $(du -h project.zip | cut -f1)"

      - name: Extract ZIP
        run: |
          set -euo pipefail
          rm -rf project_raw
          unzip -oq project.zip -d project_raw

          SUB=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILES=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          if [ "$SUB" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d -print -quit)
          else
            PROJECT_DIR="project_raw"
          fi

          [ -f "$PROJECT_DIR/pubspec.yaml" ] || {
            echo "::error::pubspec.yaml tidak ditemukan"
            find project_raw -maxdepth 2 | head -40
            exit 1
          }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Android environment
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          # Gradle executable bit
          [ ! -f "$PROJECT_DIR/android/gradlew" ] || chmod +x "$PROJECT_DIR/android/gradlew"

          # gradle.properties defaults
          mkdir -p "$PROJECT_DIR/android"
          touch "$PROJECT_DIR/android/gradle.properties"
          grep -q '^android.useAndroidX=' "$PROJECT_DIR/android/gradle.properties" || echo 'android.useAndroidX=true' >> "$PROJECT_DIR/android/gradle.properties"
          grep -q '^android.enableJetifier=' "$PROJECT_DIR/android/gradle.properties" || echo 'android.enableJetifier=true' >> "$PROJECT_DIR/android/gradle.properties"
          grep -q '^org.gradle.jvmargs=' "$PROJECT_DIR/android/gradle.properties" || echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> "$PROJECT_DIR/android/gradle.properties"

          # NDK auto-install
          NDK_VER="$(grep -RhoE "ndkVersion[[:space:]]*[=:][[:space:]]*['\"][0-9]+\.[0-9]+\.[0-9]+['\"]" "$PROJECT_DIR/android" 2>/dev/null | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          NDK_VER="${NDK_VER:-28.2.13676358}"
          if [ ! -f "$SDK/ndk/$NDK_VER/source.properties" ]; then
            sdkmanager "ndk;$NDK_VER" >/dev/null 2>&1 || true
          fi

          # compileSdk auto-install
          COMPILE_SDK="$(grep -RhoE "compileSdk(Version)?[[:space:]]*[=:]?[[:space:]]*[0-9]+" "$PROJECT_DIR/android" 2>/dev/null | grep -Eo '[0-9]+' | tail -n1 || true)"
          [ -z "$COMPILE_SDK" ] || yes | sdkmanager "platforms;android-$COMPILE_SDK" >/dev/null 2>&1 || true

          # auto namespace
          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle"
          if [ -f "$APP_GRADLE" ] && ! grep -qE '^\s*namespace' "$APP_GRADLE"; then
            PKG="$(grep -RhoE 'package="[A-Za-z][A-Za-z0-9_.]*"' "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml" 2>/dev/null | sed -E 's/package="(.*)"/\1/' | head -n1 || true)"
            [ -z "$PKG" ] && PKG="$(grep -Eo 'applicationId[[:space:]]+"[A-Za-z][A-Za-z0-9_.]+"' "$APP_GRADLE" | sed -E 's/.*"(.*)"/\1/' | head -n1 || true)"
            [ -n "$PKG" ] && sed -i "/^[[:space:]]*android[[:space:]]*{/a\\    namespace \"$PKG\"" "$APP_GRADLE" && echo "AUTO-FIX namespace=$PKG"
          fi

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter config --no-analytics >/dev/null 2>&1 || true
          for i in 1 2 3; do
            flutter pub get && break || { echo "pub get retry $i/3"; sleep $((i*2)); }
          done

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          flutter clean >/dev/null 2>&1 || true

          if [ "$BUILD_TYPE" = "release" ]; then
            flutter build apk --release --target-platform android-arm64 --no-pub 2>&1 | tee build.log || {
              echo "::error::Build RELEASE gagal, lihat log di atas"
              exit 1
            }
          else
            flutter build apk --debug --no-pub 2>&1 | tee build.log || {
              echo "::error::Build DEBUG gagal, lihat log di atas"
              exit 1
            }
          fi

          APK="$(find build/app/outputs/flutter-apk -name '*.apk' -type f | head -n1)"
          [ -n "$APK" ] || { echo "::error::APK tidak ditemukan setelah build"; exit 1; }
          mkdir -p build/out
          cp "$APK" build/out/app-release.apk
          echo "APK_PATH=$PROJECT_DIR/build/out/app-release.apk" >> "$GITHUB_ENV"
          echo "BUILD OK: $(du -h build/out/app-release.apk | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          APK="${{ env.APK_PATH }}"
          test -s "$APK"

          # Pastikan release ada
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Auto build by BuildApkDiks"

          # Upload (replace jika sudah ada)
          gh release upload "$TAG" "$APK" --clobber
          echo "RELEASE UPLOAD OK: $TAG"
