
name: Build Web2APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "ID unik job"
        required: true
        type: string
      userId:
        description: "ID user"
        required: false
        default: "0"
        type: string
      payload:
        description: "JSON payload dari bot"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: web2apk-${{ inputs.jobId }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # JAVA
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # FLUTTER
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =========================
      # INSTALL TOOLS
      # =========================
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # =========================
      # PARSE PAYLOAD
      # =========================
      - name: Parse payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urlparse

          cfg = json.loads(os.environ["PAYLOAD"])

          mode = str(cfg.get("mode") or "url").lower()

          if mode != "url":
              raise SystemExit("::error::Mode hanya mendukung url")

          url = str(cfg.get("url") or "").strip()

          if not url:
              raise SystemExit("::error::URL kosong")

          if not re.match(r"^https?://", url, re.I):
              url = "https://" + url

          parsed = urlparse(url)

          if parsed.scheme not in ("http", "https") or not parsed.hostname:
              raise SystemExit("::error::URL tidak valid")

          name = str(cfg.get("appName") or "Web App")
          name = re.sub(r"[\r\n\t]+", " ", name).strip()
          name = name[:50] or "Web App"

          icon = str(cfg.get("iconUrl") or "").strip()

          if icon and not re.match(r"^https?://", icon, re.I):
              raise SystemExit("::error::iconUrl harus HTTP/HTTPS")

          with open("cfg.json", "w", encoding="utf-8") as f:
              json.dump({
                  "url": url,
                  "name": name,
                  "icon": icon
              }, f)

          print("App Name:", name)
          print("URL:", url)
          print("Icon:", "Custom" if icon else "Default")
          PY

      # =========================
      # CREATE FLUTTER PROJECT
      # =========================
      - name: Create Flutter project
        run: |
          set -euo pipefail

          flutter config --no-analytics

          flutter create \
            --org com.w2a \
            --platforms=android \
            --project-name webapp \
            webapp

          cd webapp

          flutter pub add webview_flutter
          flutter pub add --dev flutter_launcher_icons

      # =========================
      # GRADLE CACHE
      # =========================
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # =========================
      # GENERATE MAIN DART
      # =========================
      - name: Generate app code and manifest
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import re
          import html
          import textwrap

          cfg = json.load(open("cfg.json", encoding="utf-8"))

          def dart_string(value):
              return json.dumps(value, ensure_ascii=True)

          dart = r'''
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String kStartUrl = __URL__;
          const String kAppTitle = __TITLE__;

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const App());
          }

          class App extends StatelessWidget {
            const App({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: kAppTitle,
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: Colors.blue,
                ),
                home: const WebPage(),
              );
            }
          }

          class WebPage extends StatefulWidget {
            const WebPage({super.key});

            @override
            State<WebPage> createState() => _WebPageState();
          }

          class _WebPageState extends State<WebPage> {
            late final WebViewController controller;

            int progress = 0;
            bool hasError = false;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (_) {
                      if (mounted) {
                        setState(() => hasError = false);
                      }
                    },
                    onProgress: (value) {
                      if (mounted) {
                        setState(() => progress = value);
                      }
                    },
                    onWebResourceError: (error) {
                      if (error.isForMainFrame == true && mounted) {
                        setState(() => hasError = true);
                      }
                    },
                  ),
                )
                ..loadRequest(Uri.parse(kStartUrl));
            }

            Future<void> handleBack() async {
              if (await controller.canGoBack()) {
                await controller.goBack();
              } else {
                SystemNavigator.pop();
              }
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) async {
                  if (!didPop) {
                    await handleBack();
                  }
                },
                child: Scaffold(
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: controller),

                        if (progress < 100 && !hasError)
                          LinearProgressIndicator(
                            value: progress / 100,
                          ),

                        if (hasError)
                          Container(
                            color: Theme.of(context).colorScheme.surface,
                            alignment: Alignment.center,
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const Icon(
                                  Icons.wifi_off,
                                  size: 56,
                                ),
                                const SizedBox(height: 12),
                                const Text(
                                  'Gagal memuat halaman',
                                ),
                                const SizedBox(height: 12),
                                FilledButton(
                                  onPressed: () {
                                    setState(() {
                                      hasError = false;
                                    });

                                    controller.loadRequest(
                                      Uri.parse(kStartUrl),
                                    );
                                  },
                                  child: const Text('Coba lagi'),
                                ),
                              ],
                            ),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          '''

          dart = textwrap.dedent(dart)
          dart = dart.replace("__URL__", dart_string(cfg["url"]))
          dart = dart.replace("__TITLE__", dart_string(cfg["name"]))

          with open("webapp/lib/main.dart", "w", encoding="utf-8") as f:
              f.write(dart)

          manifest = "webapp/android/app/src/main/AndroidManifest.xml"

          with open(manifest, encoding="utf-8") as f:
              content = f.read()

          label = html.escape(cfg["name"], quote=True)

          content = re.sub(
              r'android:label="[^"]*"',
              lambda m: 'android:label="' + label + '"',
              content,
              count=1
          )

          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>\n'
                  "    <application",
                  1
              )

          if "usesCleartextTraffic" not in content:
              content = content.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(content)

          print("Main Dart generated")
          print("Manifest updated")
          PY

      # =========================
      # CUSTOM ICON
      # =========================
      - name: Setup app icon
        continue-on-error: true
        run: |
          set -euo pipefail

          ICON=$(python3 -c \
            "import json; print(json.load(open('cfg.json'))['icon'])")

          if [ -z "$ICON" ]; then
            echo "Using default icon"
            exit 0
          fi

          cd webapp

          mkdir -p assets

          if ! curl -fL --retry 3 \
            --max-time 30 \
            -o assets/icon_raw "$ICON"; then
            echo "::warning::Icon download failed"
            exit 0
          fi

          if ! identify assets/icon_raw >/dev/null 2>&1; then
            echo "::warning::Invalid icon file"
            exit 0
          fi

          convert assets/icon_raw \
            -resize 512x512 \
            -background none \
            -gravity center \
            -extent 512x512 \
            PNG32:assets/icon.png

          rm -f assets/icon_raw

          cat >> pubspec.yaml <<'YAML'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/icon.png
            min_sdk_android: 21
          YAML

          flutter pub get
          dart run flutter_launcher_icons

      # =========================
      # VALIDATE PROJECT
      # =========================
      - name: Validate project
        run: |
          set -euo pipefail

          cd webapp

          flutter doctor -v
          flutter pub get

          # Remove default test that references MyApp
          rm -f test/widget_test.dart

          dart format lib/main.dart

          flutter analyze --no-pub

      # =========================
      # BUILD APK
      # =========================
      - name: Build APK
        run: |
          set -euo pipefail

          cd webapp

          flutter clean
          flutter pub get

          flutter build apk \
            --release \
            --target-platform android-arm,android-arm64 \
            --verbose

      # =========================
      # COLLECT APK
      # =========================
      - name: Collect APK
        if: success()
        run: |
          set -euo pipefail

          mkdir -p out

          find webapp/build/app/outputs \
            -type f \
            -name '*.apk' \
            -exec cp {} out/ \;

          echo "APK output:"
          ls -lh out

          if ! find out -name '*.apk' | grep -q .; then
            echo "::error::APK tidak ditemukan"
            exit 1
          fi

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: out/*.apk
          retention-days: 1
          if-no-files-found: error
